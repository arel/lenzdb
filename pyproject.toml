[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lenzdb"
version = "0.1.4"
description = "SQL views over CSV files, with safe edits back to text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Arel Cordero" }
]
maintainers = [
  { name = "Arel Cordero" }
]
dependencies = [
  "duckdb>=1.5.0",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.0",
  "rich>=15.0.0",
  "sqlglot>=30.0.0",
  "typer>=0.24.0",
]
keywords = ["csv", "sql", "git", "data", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.0",
]

[project.scripts]
lnz = "lenzdb.cli:main"

[project.urls]
Homepage = "https://github.com/arel/lenzdb"
Repository = "https://github.com/arel/lenzdb"
Issues = "https://github.com/arel/lenzdb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lenzdb"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/CONTRIBUTORS.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
